name: Test and build Looprd images

on:
  pull_request:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: looprd
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: looprd_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U looprd -d looprd_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LOOPRD_TEST_POSTGRES_URL: postgresql://looprd:test-only@localhost:5432/looprd_test
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.lock -e '.[test]'
      - run: python -m pytest -q
      - run: python -m looprd validate examples/looprd.yaml
      - run: python -m looprd validate --sources examples/sources.yaml
      - run: python -m looprd validate examples/python-handler.yaml
      - run: python -m looprd validate examples/database-auth.yaml

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Set lowercase image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build native smoke image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          load: true
          tags: looprd:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Exercise the built container and Traefik routing
        run: python3 scripts/container_smoke.py docker looprd:smoke --traefik
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: metadata
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
